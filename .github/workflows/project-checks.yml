name: Project checks

on:
  pull_request:
  push:
    branches:
      - claude/build-photo-portfolio-Th0gm

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
